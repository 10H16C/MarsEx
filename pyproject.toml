[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entity-resolver"
version = "0.1.0"
description = "Technology entity disambiguation: exact aliases, name-matching candidates, LLM selection."
requires-python = ">=3.12"
dependencies = ["anthropic>=2.2", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
entity-resolver = "entity_resolver.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/entity_resolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
